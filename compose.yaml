services:
  atlas:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: atlas

    restart: unless-stopped

    init: true

    ports:
      - "${ATLAS_PORT:-8080}:8080"

    environment:
      ATLAS_ROOT: /app
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /app/src

    volumes:
      - atlas-state:/app/.ai/memory/db
      - atlas-logs:/app/logs
      - atlas-runtime:/app/runtime

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3).read()"
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

    stop_grace_period: 30s

volumes:
  atlas-state:
  atlas-logs:
  atlas-runtime:
