[project]
name = "atlas"
version = "0.1.0"
description = "Atlas autonomous engineering system"
readme = "README.md"
authors = [
    { name = "Anthony Kimolo Fabian", email = "afkimolo@gmail.com" }
]
requires-python = ">=3.14"

dependencies = [
    "fastapi>=0.115",
    "gitpython>=3.1.51",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "orjson>=3.11.9",
    "platformdirs>=4.10.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.26.8",
    "uvicorn[standard]>=0.34",
    "watchdog>=6.0.0",
]

[project.scripts]
atlas = "atlas:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0",
]
